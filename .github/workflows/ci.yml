name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_LOG_DIR: ${{ github.workspace }}/ci-logs

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: tools/ci/step.sh pip "pip install -r tools/sim/requirements.txt"
      - run: tools/ci/step.sh sim-tests "cd tools/sim && python -m pytest -q -p no:cacheprovider"
      - run: tools/ci/step.sh codegen-up-to-date "python tools/codegen/gen_dart_proto.py && git diff --exit-code -- packages/atv_remote/lib/src/proto"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-python
          path: ci-logs
      - run: tools/ci/finish.sh

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: tools/ci/step.sh setup "pip install -r tools/sim/requirements.txt && dart --version && (cd packages/atv_remote && dart pub get) && (cd packages/companion_protocol && dart pub get)"
      - run: tools/ci/step.sh atv-analyze "cd packages/atv_remote && dart analyze --fatal-infos"
      - run: tools/ci/step.sh atv-test "cd packages/atv_remote && ATV_SIM_PYTHON=$(which python) dart test --reporter expanded"
      - run: tools/ci/step.sh companion-analyze "cd packages/companion_protocol && dart analyze --fatal-infos"
      - run: tools/ci/step.sh companion-test "cd packages/companion_protocol && dart test --reporter expanded"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dart
          path: ci-logs
      - run: tools/ci/finish.sh

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: tools/ci/step.sh launcher-kotlin-tests "cd apps/launcher/android && ./gradlew --no-daemon :app:testDebugUnitTest"
      - run: tools/ci/step.sh launcher-apk "cd apps/launcher/android && ./gradlew --no-daemon :app:assembleRelease"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-launcher
          path: ci-logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/launcher/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
      - run: tools/ci/finish.sh

  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: tools/ci/step.sh remote-pub "cd apps/remote && flutter --version && flutter pub get"
      - run: tools/ci/step.sh remote-analyze "cd apps/remote && flutter analyze --fatal-infos"
      - run: tools/ci/step.sh remote-test "cd apps/remote && flutter test --reporter expanded"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-remote
          path: ci-logs
      - run: tools/ci/finish.sh

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: tools/ci/step.sh ios-pub "cd apps/remote && flutter pub get"
      - run: tools/ci/step.sh ios-build "tools/ci/build_ios.sh"
      - run: tools/ci/step.sh macos-build "cd apps/remote && flutter build macos --release && cd build/macos/Build/Products/Release && ditto -c -k --keepParent 'TV Control.app' \"$GITHUB_WORKSPACE/TVControl-mac.zip\""
      - run: tools/ci/step.sh ios-ipa "tools/ci/package_ipa.sh apps/remote/build/ios/iphoneos/Runner.app TVControl.ipa"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios
          path: ci-logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: TVControl.ipa
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: TVControl-mac.zip
          if-no-files-found: ignore
      - name: Keep the generated Xcode project in the repo
        if: success()
        run: |
          built=$(cut -d' ' -f1 ci-logs/ios-build.status 2>/dev/null || echo 1)
          if [ "$built" = 0 ] && ! git diff --quiet -- apps/remote/ios/Runner.xcodeproj; then
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git add apps/remote/ios/Runner.xcodeproj
            git commit -m "chore: sync Xcode project (TVWidgets extension)"
            git pull --rebase -q origin main && git push -q origin HEAD:main || echo "push skipped"
          fi
      - run: tools/ci/finish.sh

  release:
    needs: [launcher, remote, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ipa
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - name: Update the rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ls -la dist
          mv dist/app-release.apk dist/TVControl-launcher.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/TVControl-launcher.apk dist/TVControl.ipa dist/TVControl-mac.zip \
            --title "Última build (${GITHUB_SHA::7})" --prerelease --target "$GITHUB_SHA" \
            --notes "Build automática de ${GITHUB_SHA::12}. IPA sin firmar para SideStore; APK del launcher para instalar por ADB; app de barra de menú para Mac (sin notarizar: clic derecho › Abrir)."

  report:
    needs: [python, dart, launcher, remote, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: logs-*
      - name: Publish results to the ci-results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          JOB_RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -eu
          mkdir -p artifacts
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch ci-results "$remote" out 2>/dev/null; then :; else
            mkdir out && cd out && git init -q && git checkout -q -b ci-results && git remote add origin "$remote" && cd ..
          fi
          python tools/ci/report.py artifacts out
          cd out
          git config user.name "ci-results"
          git config user.email "ci-results@users.noreply.github.com"
          git add -A
          git commit -q -m "results for ${GITHUB_SHA::12}"
          for i in 1 2 3; do
            git push -q origin ci-results && exit 0
            git pull -q --rebase origin ci-results || true
          done
          exit 1
