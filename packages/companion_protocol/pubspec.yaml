name: companion_protocol
description: >-
  Messages and client for the companion service that runs inside the TV
  launcher (apps with icons, launch any app, launcher layout, inputs,
  now playing, usage, backup). Shared contract with the Kotlin server.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
