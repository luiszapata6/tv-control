name: tv_remote
description: iPhone remote for the Hisense Android TV and the TV Control launcher.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  atv_remote:
    path: ../../packages/atv_remote
  companion_protocol:
    path: ../../packages/companion_protocol
  bonsoir: ^7.1.0
  flutter_secure_storage: ^10.3.0
  shared_preferences: ^2.3.0
  speech_to_text: ^7.3.0
  google_fonts: ">=6.2.0 <9.0.0"
  material_symbols_icons: ">=4.2785.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
